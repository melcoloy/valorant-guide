name: Vérifier les données et le code

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/js/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/js/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/**"

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier lineups.json et meta-maps.json
        run: python scripts/valider_donnees.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests des calculs et du repli hors ligne
        run: npm test
